services:
  - type: web
    name: trassa-portal
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trassa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAX_UPLOAD_MB
        value: 25
      - key: STORAGE_DRIVER
        value: local
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: eu-central-1
      - key: S3_BUCKET
        sync: false
      - key: S3_PREFIX
        value: documents
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: false
      - key: S3_SERVER_SIDE_ENCRYPTION
        value: AES256
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: trassa-db
    plan: free
    databaseName: trassa
    user: trassa
