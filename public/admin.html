<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TRASSA Admin</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a2940;background:#f5f8fc}
    *{box-sizing:border-box} body{margin:0;background:#f5f8fc;color:#1a2940}.hidden{display:none!important}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:#fff;border:1px solid #dfe7ef;border-radius:14px;padding:24px;box-shadow:0 16px 45px rgba(34,67,104,.10)}
    .login-card{width:min(440px,100%)} h1,h2,h3{margin:0 0 12px;color:#17263a}.muted{color:#728095}.stack{display:grid;gap:12px}
    label{font-size:13px;color:#536378} input,select,textarea{width:100%;border:1px solid #d8e2eb;background:#fff;color:#26364a;border-radius:9px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#75bce8;box-shadow:0 0 0 3px rgba(11,130,216,.09)}
    button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.btn{background:#0b82d8;color:#fff}.btn.secondary{background:#eef3f8;color:#41546b}.btn.danger{background:#e65353;color:#fff}.btn.small{padding:7px 10px;font-size:12px}
    .error{color:#d84646;font-size:13px}.success{color:#249148;font-size:13px}
    .layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e2e9f0;padding:20px 16px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:900;margin:4px 10px 24px;color:#107bc8}.brand span{color:#107bc8}
    nav{display:grid;gap:6px}.navbtn{width:100%;text-align:left;background:transparent;color:#46566c;border:0}.navbtn.active,.navbtn:hover{background:#e8f3ff;color:#086fc1}
    .main{padding:26px 30px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.stat{background:#fff;border:1px solid #e1e9f0;border-radius:11px;padding:18px;box-shadow:0 3px 12px rgba(28,57,91,.04)}.stat b{display:block;font-size:28px;margin-top:6px;color:#142235}
    .panel{background:#fff;border:1px solid #e1e9f0;border-radius:11px;padding:18px;overflow:auto;box-shadow:0 3px 12px rgba(28,57,91,.04)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:300px}.table{width:100%;border-collapse:collapse;min-width:840px}.table th,.table td{text-align:left;border-bottom:1px solid #e9eef4;padding:10px;font-size:13px;vertical-align:top}.table th{color:#6c7b8e;font-weight:700}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f6;font-size:12px}.badge.ok{background:#e8f8ed;color:#24823c}.badge.warn{background:#fff4d6;color:#956600}.badge.bad{background:#ffeded;color:#c63d3d}.actions{display:flex;gap:6px;flex-wrap:wrap}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.modal{position:fixed;inset:0;background:rgba(29,48,72,.42);display:grid;place-items:center;padding:20px;z-index:20}.modal .card{width:min(560px,100%)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid #e2e9f0}.sidebar nav{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:16px}}
  </style>
<style>.brand .trassa-logo-mark{width:36px;height:36px;display:block;flex:0 0 36px}.brand{letter-spacing:.02em!important}</style></head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="card login-card">
      <h1>TRASSA <span style="color:#ff2f61">Admin</span></h1>
      <p class="muted">Melde dich mit einem Administrator-Konto an.</p>
      <form id="loginForm" class="stack">
        <div><label>E-Mail</label><input id="email" type="email" required autocomplete="username"></div>
        <div><label>Passwort</label><input id="password" type="password" required minlength="10" autocomplete="current-password"></div>
        <button class="btn" type="submit">Anmelden</button>
        <div id="loginMsg" class="error"></div>
      </form>
      <p class="muted" style="font-size:12px;margin-top:16px">Falls noch kein Admin existiert, setze in Render die Variablen <b>ADMIN_EMAIL</b> und <b>ADMIN_PASSWORD</b> und deploye neu.</p>
    </div>
  </div>

  <div id="adminView" class="layout hidden">
    <aside class="sidebar">
      <div class="brand" style="display:flex;align-items:center;gap:10px"><svg class="trassa-logo-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M25 5h14l18 54H45l-4-12H23l-4 12H7L25 5Z" fill="#0b84d8"/><path d="M29 13h6l3 9H26l3-9Zm-5 16h16l3 8H21l3-8Zm-6 16h28l3 8H15l3-8Z" fill="#fff"/><path d="M31 5h2v54h-2z" fill="#dff3ff" opacity=".95"/></svg><span><b>TRASSA</b> <span>Admin</span></span></div>
      <nav id="nav">
        <button class="navbtn active" data-section="dashboard">Dashboard</button>
        <button class="navbtn" data-section="companies">Unternehmen</button>
        <button class="navbtn" data-section="users">Benutzer</button>
        <button class="navbtn" data-section="requests">Anfragen</button>
        <button class="navbtn" data-section="offers">Angebote</button>
        <button class="navbtn" data-section="transports">Transporte</button>
        <button class="navbtn" data-section="invoices">Rechnungen</button>
        <button class="navbtn" data-section="audit">Audit-Log</button>
      </nav>
      <button id="logoutBtn" class="btn secondary" style="width:100%;margin-top:20px">Abmelden</button>
    </aside>
    <main class="main">
      <div class="topbar"><div><h2 id="pageTitle">Dashboard</h2><div id="adminIdentity" class="muted"></div></div><button id="refreshBtn" class="btn secondary">Aktualisieren</button></div>
      <div id="content"></div>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="card"><div id="modalBody"></div></div></div>
  <script src="/admin.js"></script>
</body>
</html>
